<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>异形画布 Demo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .pwca-demo {
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .pwca-demo__title {
    font-size: 18px;
    color: #333;
    align-self: flex-start;
  }
  .pwca-demo__toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    align-self: stretch;
  }
  .pwca-demo__btn {
    padding: 6px 12px;
    border: 1px solid #d0d0d0;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .pwca-demo__btn:hover { background: #f0f6ff; border-color: #6aa9ff; }
  .pwca-demo__btn--danger { color: #c0392b; }
  .pwca-demo__stage-wrap {
    /* 舞台外框：棋盘格底 + 阴影 + 内边距，把"舞台"和"页面"区分开 */
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    background-color: #f7f7f7;
    /* 浅色棋盘格，表示"非舞台区域" */
    background-image:
      linear-gradient(45deg, #ececec 25%, transparent 25%),
      linear-gradient(-45deg, #ececec 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ececec 75%),
      linear-gradient(-45deg, transparent 75%, #ececec 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    padding: 32px;
    max-width: 95vw;
    max-height: 85vh;
    overflow: auto;
  }
  /* fabric.js 注入的 .canvas-container：居中 + 阴影 + 白底 */
  .pwca-demo__stage-wrap .canvas-container {
    margin: 0 auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    background: #fff;
  }
  .pwca-demo__stage { display: block; }
  .pwca-demo__file { display: none; }

  /* micromodal 基础样式 */
  /* 默认隐藏：micromodal 通过 .is-open 控制显隐 */
  .modal { display: none; }
  .modal.is-open { display: block; }
  .modal__overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .modal__container {
    background: #fff;
    border-radius: 8px;
    max-width: 480px;
    width: 90%;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .modal__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal__title { font-size: 16px; font-weight: 600; margin: 0; }
  .modal__close { background: none; border: 0; font-size: 20px; cursor: pointer; }
  .modal__content label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .modal__content input[type="text"] {
    width: 100%; box-sizing: border-box;
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
  }
  .modal__footer { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }

  /* toast */
  .pwca-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: rgba(0,0,0,0.78); color: #fff;
    padding: 8px 16px; border-radius: 4px; font-size: 13px;
    z-index: 10000; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .pwca-toast.is-show { opacity: 1; }
</style>
</head>
<body>
  <div class="pwca-demo">
    <div class="pwca-demo__title">异形画布 Demo（fabric.js CDN，舞台 = bg.jpg 原始尺寸）</div>

    <div class="pwca-demo__toolbar">
      <button class="pwca-demo__btn" id="pwca-btn-add-text">添加文字</button>
      <button class="pwca-demo__btn" id="pwca-btn-add-image">上传图片</button>
      <button class="pwca-demo__btn" id="pwca-btn-add-url">添加图片(URL)</button>
      <button class="pwca-demo__btn" id="pwca-btn-cycle-mask" title="alpha → 灰度 → 反转 → alpha">切 mask 模式</button>
      <button class="pwca-demo__btn" id="pwca-btn-show-mask" title="临时显示 mask，看实际形状">显示 mask</button>
      <button class="pwca-demo__btn" id="pwca-btn-circle-test" title="临时换成圆形 clipPath，验证机制">圆形测试</button>
      <button class="pwca-demo__btn" id="pwca-btn-toggle-bg" title="隐藏/显示 bg.jpg 背景">隐藏背景</button>
      <span style="flex:1"></span>
      <button class="pwca-demo__btn" id="pwca-btn-front">上移一层</button>
      <button class="pwca-demo__btn" id="pwca-btn-back">下移一层</button>
      <button class="pwca-demo__btn pwca-demo__btn--danger" id="pwca-btn-delete">删除选中</button>
      <button class="pwca-demo__btn pwca-demo__btn--danger" id="pwca-btn-clear">清空图层</button>
    </div>

    <div class="pwca-demo__stage-wrap">
      <canvas id="pwca-canvas" class="pwca-demo__stage" width="800" height="800"></canvas>
    </div>

    <input type="file" id="pwca-file" class="pwca-demo__file" accept="image/*" />
  </div>

  <!-- micromodal: 添加图片URL弹窗 -->
  <div class="modal micromodal-slide" id="pwca-modal-url" aria-hidden="true">
    <div class="modal__overlay" data-micromodal-close>
      <div class="modal__container" role="dialog" aria-modal="true" aria-labelledby="pwca-modal-url-title">
        <header class="modal__header">
          <h2 class="modal__title" id="pwca-modal-url-title">添加图片</h2>
          <button class="modal__close" aria-label="关闭" data-micromodal-close>&times;</button>
        </header>
        <div class="modal__content">
          <label for="pwca-url-input">图片 URL</label>
          <input type="text" id="pwca-url-input" placeholder="https://..." />
        </div>
        <footer class="modal__footer">
          <button class="pwca-demo__btn" data-micromodal-close>取消</button>
          <button class="pwca-demo__btn" id="pwca-url-confirm">添加</button>
        </footer>
      </div>
    </div>
  </div>

  <div class="pwca-toast" id="pwca-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/micromodal@0.4.10/dist/micromodal.min.js"></script>
  <script>
    (function () {
      const BG_URL = './bg.jpg';
      const MASK_URL = './mask.png';

      const canvasEl = document.getElementById('pwca-canvas');
      const canvas = new fabric.Canvas(canvasEl, {
        backgroundColor: '#ffffff',
        selection: true,
        preserveObjectStacking: true
      });

      // 画布底色：棋盘格（透明感），避免纯白
      // 跟"舞台外"的棋盘格统一，bg.jpg 隐藏时也不突兀
      (function applyCheckerboardBg() {
        const cell = 16;
        const c = document.createElement('canvas');
        c.width = c.height = cell * 2;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, cell * 2, cell * 2);
        ctx.fillStyle = '#e6e6e6';
        ctx.fillRect(0, 0, cell, cell);
        ctx.fillRect(cell, cell, cell, cell);
        const pattern = new fabric.Pattern({
          source: c,
          repeat: 'repeat'
        });
        canvas.backgroundColor = pattern;
        canvas.requestRenderAll();
      })();

      // 异形遮罩：mask.png 不显示，但所有非背景图层通过它的形状裁剪
      // maskMode: 'alpha'(默认，保留原PNG alpha通道) | 'gray'(灰度=alpha) | 'inverted'(反转)
      let maskObj = null;
      let maskMode = 'alpha';

      // ============ toast ============
      const toastEl = document.getElementById('pwca-toast');
      let toastTimer = null;
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('is-show'), 1800);
      }

      // ============ 工具：获取舞台中心 ============
      function centerX() { return canvas.getWidth() / 2; }
      function centerY() { return canvas.getHeight() / 2; }
      function isModalOpen() {
        return document.querySelector('.modal.is-open') !== null;
      }

      // ============ 背景：尺寸 = bg.jpg 原始尺寸 ============
      function loadBackground() {
        fabric.Image.fromURL(BG_URL, function (img) {
          if (!img || !img.getElement() || !img.getElement().naturalWidth) {
            console.warn('[PWCA Demo] 背景图加载失败：', BG_URL);
            toast('背景图加载失败');
            return;
          }

          // 关键：把 canvas 内部坐标系改成 bg.jpg 原始尺寸
          canvas.setWidth(img.width);
          canvas.setHeight(img.height);

          // 背景图填满整个 canvas（坐标系 1:1）
          img.set({
            originX: 'left',
            originY: 'top',
            left: 0,
            top: 0,
            scaleX: 1,
            scaleY: 1,
            selectable: false,
            evented: false,
            hoverCursor: 'default',
            excludeFromExport: false
          });
          img.set('data', Object.assign(img.data || {}, { role: 'background' }));

          // 清空已有对象再加入背景（避免重复）
          canvas.getObjects().slice().forEach(o => canvas.remove(o));
          canvas.add(img);
          canvas.sendToBack(img);
          canvas.requestRenderAll();

          console.log('[PWCA Demo] 舞台已设为背景图尺寸', { w: img.width, h: img.height });
          toast('舞台尺寸：' + img.width + ' × ' + img.height);

          // 背景就绪后加载 mask
          loadMask();
        }, { crossOrigin: 'anonymous' });
      }

      // ============ 异形遮罩：mask.png 不显示，但作为所有图层的裁剪形状 ============
      // 把 mask 转成 alpha-only 图像：data[i+3] 由 mode 决定
      // - 'alpha':     保留原 PNG alpha 通道（标准用法：alpha=1 显示，alpha=0 裁掉）
      // - 'gray':      用 RGB 灰度作为 alpha（适配"白底黑形状"等位图）
      // - 'inverted':  反转（适配 alpha 方向反了的 mask）
      function buildMaskCanvas(srcEl, mode) {
        const c = document.createElement('canvas');
        const W = srcEl.naturalWidth || srcEl.width;
        const H = srcEl.naturalHeight || srcEl.height;
        c.width = W;
        c.height = H;
        const ctx = c.getContext('2d');
        ctx.drawImage(srcEl, 0, 0);
        const id = ctx.getImageData(0, 0, W, H);
        const data = id.data;
        for (let i = 0; i < data.length; i += 4) {
          const origA = data[i + 3];
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const gray = (r + g + b) / 3;
          if (mode === 'alpha') {
            // 保留原 alpha（PNG 透明区 = 裁掉，不透明区 = 显示）
            // 不修改
          } else if (mode === 'gray') {
            data[i + 3] = gray;
          } else if (mode === 'inverted') {
            // 反转原 alpha
            data[i + 3] = 255 - origA;
          }
        }
        ctx.putImageData(id, 0, 0);
        return c;
      }

      function loadMask() {
        fabric.Image.fromURL(MASK_URL, function (img) {
          if (!img || !img.getElement() || !img.getElement().naturalWidth) {
            console.warn('[PWCA Demo] mask 加载失败：', MASK_URL);
            return;
          }
          const W = canvas.getWidth();
          const H = canvas.getHeight();
          const scale = Math.min(W / img.width, H / img.height);

          // 重新创建 fabric.Image，源 = 按 mode 处理后的 canvas
          const srcEl = img.getElement();
          const maskedCanvas = buildMaskCanvas(srcEl, maskMode);
          const newImg = new fabric.Image(maskedCanvas);

          newImg.set({
            originX: 'left',
            originY: 'top',
            left: (W - img.width * scale) / 2,
            top: (H - img.height * scale) / 2,
            scaleX: scale,
            scaleY: scale,
            selectable: false,
            evented: false,
            hoverCursor: 'default',
            visible: false,
            excludeFromExport: true
          });
          newImg.set('data', { role: 'mask' });
          maskObj = newImg;
          newImg.absolutePositioned = true;

          canvas.getObjects().forEach(o => {
            if (o.data && (o.data.role === 'background' || o.data.role === 'mask')) return;
            applyMask(o);
          });
          canvas.requestRenderAll();

          console.log('[PWCA Demo] mask 已加载（mode=' + maskMode + '）', {
            w: img.width, h: img.height, scale, l: newImg.left, t: newImg.top
          });
          const modeLabel = { alpha: '原 alpha', gray: '灰度', inverted: '反转' }[maskMode];
          toast('mask 已加载（' + modeLabel + '）');
        }, { crossOrigin: 'anonymous' });
      }

      function applyMask(obj) {
        if (!maskObj) return;
        obj.clipPath = maskObj;
        if (maskObj.absolutePositioned !== true) {
          maskObj.absolutePositioned = true;
        }
      }

      // 调试：临时显示/隐藏 mask（看 mask 实际长啥样）
      function toggleMaskVisible() {
        if (!maskObj) return;
        const onCanvas = canvas.getObjects().indexOf(maskObj) !== -1;
        if (onCanvas) {
          canvas.remove(maskObj);
          toast('mask 已隐藏');
        } else {
          maskObj.visible = true;
          canvas.add(maskObj);
          canvas.bringToFront(maskObj); // 顶层显示，方便观察
          toast('mask 已显示（画布顶层）');
        }
        canvas.requestRenderAll();
      }

      // 切换背景显隐（保留对象在画布上，仅切换 visible）
      function toggleBackground() {
        const bg = canvas.getObjects().find(o => o.data && o.data.role === 'background');
        if (!bg) { toast('背景不存在'); return; }
        bg.visible = !bg.visible;
        // 重排层级：背景必须在最底
        canvas.sendToBack(bg);
        canvas.requestRenderAll();
        const btn = document.getElementById('pwca-btn-toggle-bg');
        if (btn) btn.textContent = bg.visible ? '隐藏背景' : '显示背景';
        toast('背景：' + (bg.visible ? '显示' : '隐藏'));
      }

      // 调试：圆形 clipPath 测试（验证 fabric.js clipPath 机制本身是否正常）
      function useCircleClip() {
        const c = new fabric.Circle({
          radius: Math.min(canvas.getWidth(), canvas.getHeight()) / 4,
          originX: 'center', originY: 'center',
          left: canvas.getWidth() / 2,
          top: canvas.getHeight() / 2
        });
        c.absolutePositioned = true;
        // 移除旧 mask
        if (maskObj) {
          canvas.getObjects().forEach(o => { if (o.clipPath === maskObj) o.clipPath = null; });
          const oldMask = canvas.getObjects().find(o => o.data && o.data.role === 'mask');
          if (oldMask) canvas.remove(oldMask);
          maskObj = null;
        }
        maskObj = c;
        c.set('data', { role: 'mask' });
        // 重新应用
        canvas.getObjects().forEach(o => {
          if (o.data && (o.data.role === 'background' || o.data.role === 'mask')) return;
          applyMask(o);
        });
        canvas.requestRenderAll();
        toast('已切换为圆形 clipPath（测试）');
      }

      // 切换 mask 模式：alpha -> gray -> inverted -> alpha
      function cycleMaskMode() {
        const order = ['alpha', 'gray', 'inverted'];
        const idx = order.indexOf(maskMode);
        maskMode = order[(idx + 1) % order.length];
        // 移除旧 mask + 解除所有 clipPath 引用
        if (maskObj) {
          canvas.getObjects().forEach(o => { if (o.clipPath === maskObj) o.clipPath = null; });
          const oldMask = canvas.getObjects().find(o => o.data && o.data.role === 'mask');
          if (oldMask) canvas.remove(oldMask);
          maskObj = null;
        }
        loadMask();
      }

      // ============ 文字 ============
      function addText() {
        const t = new fabric.IText('双击编辑文字', {
          left: centerX(),
          top: centerY(),
          originX: 'center',
          originY: 'center',
          fontSize: Math.max(24, Math.round(canvas.getWidth() / 24)),
          fill: '#222',
          fontFamily: 'Microsoft YaHei, sans-serif',
          editable: true
        });
        t.set('data', { role: 'text' });
        canvas.add(t);
        applyMask(t);
        canvas.setActiveObject(t);
        t.enterEditing();
        t.selectAll();
        canvas.requestRenderAll();
      }

      // ============ 图片 ============
      function addImageFromURL(url) {
        return new Promise((resolve, reject) => {
          fabric.Image.fromURL(url, function (img) {
            if (!img) return reject(new Error('图片加载失败：' + url));
            fitAndAddImage(img);
            resolve(img);
          }, { crossOrigin: 'anonymous' });
        });
      }

      function addImageFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function (e) {
            fabric.Image.fromURL(e.target.result, function (img) {
              if (!img) return reject(new Error('文件读取失败'));
              fitAndAddImage(img);
              resolve(img);
            });
          };
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      // 图片适配：最大边 ≤ 舞台短边的 50%，居中放置
      function fitAndAddImage(img) {
        const stageShort = Math.min(canvas.getWidth(), canvas.getHeight());
        const maxSide = Math.max(50, stageShort * 0.5);
        const scale = Math.min(maxSide / img.width, maxSide / img.height, 1);
        img.set({
          left: centerX(),
          top: centerY(),
          originX: 'center',
          originY: 'center',
          scaleX: scale,
          scaleY: scale
        });
        img.set('data', { role: 'image' });
        canvas.add(img);
        applyMask(img);
        canvas.setActiveObject(img);
        canvas.requestRenderAll();
      }

      // ============ 删除：优先删选中，没选中就删最后添加的图层 ============
      function pickRemovable() {
        const sel = canvas.getActiveObject();
        if (sel && !isProtected(sel)) return sel;
        // 兜底：找最上层且非受保护的对象
        const objs = canvas.getObjects().filter(o => !isProtected(o));
        return objs.length ? objs[objs.length - 1] : null;
      }
      function isProtected(obj) {
        const role = obj.data && obj.data.role;
        return role === 'background' || role === 'mask';
      }

      function deleteOne() {
        const target = pickRemovable();
        if (!target) {
          toast('没有可删除的图层');
          return;
        }
        if (canvas.getActiveObject() === target) canvas.discardActiveObject();
        canvas.remove(target);
        canvas.requestRenderAll();
        toast('已删除：' + ((target.data && target.data.role) || target.type));
      }

      function bringForward() {
        const obj = canvas.getActiveObject();
        if (!obj) { toast('请先选中一个图层'); return; }
        canvas.bringForward(obj);
        canvas.requestRenderAll();
      }

      function sendBackward() {
        const obj = canvas.getActiveObject();
        if (!obj) { toast('请先选中一个图层'); return; }
        if (obj.data && obj.data.role === 'background') { toast('背景已是最底层'); return; }
        canvas.sendBackwards(obj);
        const bg = canvas.getObjects().find(o => o.data && o.data.role === 'background');
        if (bg) canvas.sendToBack(bg);
        canvas.requestRenderAll();
      }

      function clearLayers() {
        const keep = canvas.getObjects().filter(o => o.data && (o.data.role === 'background' || o.data.role === 'mask'));
        canvas.getObjects().slice().forEach(o => canvas.remove(o));
        keep.forEach(o => canvas.add(o));
        // 重排层级：背景在最底，mask 在背景之上
        if (keep.length) {
          const bg = keep.find(o => o.data.role === 'background');
          if (bg) canvas.sendToBack(bg);
        }
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        toast('已清空图层（保留背景与 mask）');
      }

      // micromodal 初始化（必须 init 后 data-micromodal-close 才生效）
      function initMicroModal() {
        if (!window.MicroModal) return;
        try {
          MicroModal.init({
            awaitCloseAnimation: false,
            debugMode: false
          });
        } catch (e) {
          console.warn('[PWCA Demo] MicroModal.init 失败', e);
        }
        // 兜底：手动绑定关闭按钮（避免 CDN 异常或版本差异）
        const modal = document.getElementById('pwca-modal-url');
        if (!modal) return;
        modal.querySelectorAll('[data-micromodal-close], [data-pwca-modal-close]')
          .forEach(btn => btn.addEventListener('click', () => {
            if (window.MicroModal) MicroModal.close('pwca-modal-url');
            else modal.classList.remove('is-open');
            // 关闭后清空 input
            const input = document.getElementById('pwca-url-input');
            if (input) input.value = '';
          }));
        // ESC 关闭
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modal.classList.contains('is-open')) {
            if (window.MicroModal) MicroModal.close('pwca-modal-url');
            else modal.classList.remove('is-open');
            const input = document.getElementById('pwca-url-input');
            if (input) input.value = '';
          }
        });
      }

      // ============ 事件绑定 ============
      initMicroModal();

      document.getElementById('pwca-btn-add-text').addEventListener('click', addText);

      document.getElementById('pwca-btn-add-image').addEventListener('click', () => {
        document.getElementById('pwca-file').click();
      });
      document.getElementById('pwca-file').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) {
          addImageFromFile(f)
            .then(() => toast('图片已添加'))
            .catch(err => { console.error(err); toast('添加失败：' + err.message); });
        }
        e.target.value = '';
      });

      document.getElementById('pwca-btn-add-url').addEventListener('click', () => {
        if (window.MicroModal) MicroModal.show('pwca-modal-url');
        else {
          const url = prompt('图片 URL');
          if (url) addImageFromURL(url).catch(err => alert(err.message));
        }
      });
      document.getElementById('pwca-url-confirm').addEventListener('click', () => {
        const input = document.getElementById('pwca-url-input');
        const url = (input.value || '').trim();
        if (!url) return;
        addImageFromURL(url)
          .then(() => toast('图片已添加'))
          .catch(err => toast('加载失败：' + err.message));
        input.value = '';
        if (window.MicroModal) MicroModal.close('pwca-modal-url');
      });

      document.getElementById('pwca-btn-front').addEventListener('click', bringForward);
      document.getElementById('pwca-btn-back').addEventListener('click', sendBackward);
      document.getElementById('pwca-btn-delete').addEventListener('click', deleteOne);
      document.getElementById('pwca-btn-clear').addEventListener('click', clearLayers);
      document.getElementById('pwca-btn-cycle-mask').addEventListener('click', cycleMaskMode);
      document.getElementById('pwca-btn-show-mask').addEventListener('click', toggleMaskVisible);
      document.getElementById('pwca-btn-circle-test').addEventListener('click', useCircleClip);
      document.getElementById('pwca-btn-toggle-bg').addEventListener('click', toggleBackground);

      // 键盘：只用 Delete 键，避免 Backspace 触发浏览器返回
      // 文字编辑中不响应，弹窗打开时不响应
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Delete') return;
        if (isModalOpen()) return;
        const obj = canvas.getActiveObject();
        if (obj && obj.isEditing) return;
        // 阻止在非编辑态冒泡
        e.preventDefault();
        deleteOne();
      });

      // 暴露调试 API
      window.pwcaCanvas = canvas;
      window.pwcaAddText = addText;
      window.pwcaAddImage = addImageFromURL;
      window.pwcaClear = clearLayers;
      window.pwcaDelete = deleteOne;
      window.pwcaStageSize = () => ({ w: canvas.getWidth(), h: canvas.getHeight() });
      window.pwcaMask = () => {
        if (!maskObj) return null;
        // 统计 mask alpha 通道
        const srcEl = maskObj.getElement();
        const c = document.createElement('canvas');
        c.width = srcEl.naturalWidth || srcEl.width;
        c.height = srcEl.naturalHeight || srcEl.height;
        c.getContext('2d').drawImage(srcEl, 0, 0);
        const id = c.getContext('2d').getImageData(0, 0, c.width, c.height);
        let total = 0, nonZero = 0, maxA = 0, minA = 255;
        for (let i = 3; i < id.data.length; i += 4) {
          const a = id.data[i];
          total += a;
          if (a > 0) nonZero++;
          if (a > maxA) maxA = a;
          if (a < minA) minA = a;
        }
        return {
          w: maskObj.width, h: maskObj.height,
          scale: maskObj.scaleX,
          l: maskObj.left, t: maskObj.top,
          absolute: maskObj.absolutePositioned,
          mode: maskMode,
          alphaStats: {
            total, nonZero, minA, maxA,
            pixelCount: id.data.length / 4
          }
        };
      };
      window.pwcaCycleMask = cycleMaskMode;
      window.pwcaShowMask = toggleMaskVisible;
      window.pwcaCircleTest = useCircleClip;
      window.pwcaToggleBg = toggleBackground;
      window.pwcaListLayers = () => canvas.getObjects().map(o => ({
        role: o.data && o.data.role,
        type: o.type,
        visible: o.visible,
        hasClipPath: !!o.clipPath
      }));

      // 启动
      loadBackground();
    })();
  </script>
</body>
</html>
